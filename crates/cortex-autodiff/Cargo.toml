[package]
authors = ["nathanielsimard <nathaniel.simard.42@gmail.com>"]
categories = ["science"]
description = "Automatic differentiation backend for the Cortex framework"
edition.workspace = true
keywords = ["deep-learning", "machine-learning", "data"]
license.workspace = true
name = "cortex-autodiff"
readme = "README.md"
repository = "https://github.com/tracel-ai/burn/tree/main/crates/burn-autodiff"
documentation = "https://docs.rs/burn-autodiff"
version.workspace = true

[lints]
workspace = true

[features]
default = ["std"]
std = ["dep:parking_lot"]
export_tests = []         # check checkpointer is_empty in tests

tracing = [
    "dep:tracing",
    "cortex-std/tracing",
    "cortex-backend/tracing",
]

[dependencies]
cortex-std = { workspace = true }
cortex-backend = { workspace = true }


derive-new = { workspace = true }
spin = { workspace = true }
parking_lot = { workspace = true, optional = true }
hashbrown = { workspace = true }
num-traits = { workspace = true }
tracing = { workspace = true, optional = true, features = ["default"] }

[target.'cfg(not(target_has_atomic = "64"))'.dependencies]
portable-atomic = { workspace = true }

[dev-dependencies]
# Test-only dependency; omit it from the published package.
cortex-flex = { path = "../cortex-flex", default-features = false }

[package.metadata.docs.rs]
features = ["default"]
rustdoc-args = ["--cfg", "docsrs"]
