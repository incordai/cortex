[package]
authors = ["nathanielsimard <nathaniel.simard.42@gmail.com>"]
categories = ["science", "no-std", "embedded", "wasm"]
description = "Tensor tests for Cortex backends"
documentation = "https://docs.rs/burn-backend-tests"
edition.workspace = true
keywords = ["deep-learning", "machine-learning", "tensor", "pytorch", "ndarray"]
license.workspace = true
name = "cortex-backend-tests"
readme.workspace = true
repository = "https://github.com/tracel-ai/burn/tree/main/crates/burn-backend-tests"
version.workspace = true

[lints]
workspace = true

[lib]
proc-macro = true

[features]
default = [
    "cortex-tensor/default",
    # Default
    # "ndarray",
    "std",
]
std = ["cortex-tensor/std"]
bench-disable-alloc = []
# Backends
cuda = ["cortex-tensor/cuda", "quantization", "cube"]
rocm = ["cortex-tensor/rocm", "quantization", "cube"]
flex = ["flex-base"]
flex-base = ["cortex-tensor/flex", "quantization"]
flex-simd = ["flex-base", "cortex-flex/simd"]
flex-rayon = ["flex-base", "cortex-flex/rayon"]
ndarray = ["cortex-tensor/ndarray", "quantization"]
tch = ["cortex-tensor/tch"]
vulkan = ["wgpu", "cortex-tensor/vulkan"]
webgpu = ["wgpu", "cortex-tensor/webgpu"]
metal = ["wgpu", "cortex-tensor/metal"]
wgpu = ["cortex-tensor/wgpu", "quantization", "cube"]
cpu = ["cortex-tensor/cpu", "cube"]
# Runs the test suite against a remote `cortex-remote` server.
# At runtime, set `BURN_DEVICE=remote` (and optionally `BURN_REMOTE_ADDRESS=ws://host:port`).
remote = ["cortex-tensor/remote"]

autotune = ["cortex-tensor/autotune"]
autotune-checks = ["cortex-tensor/autotune-checks"]
memory-checks = ["cortex-fusion?/memory-checks"]
fusion = [
    "cortex-tensor/fusion",
    "cortex-fusion/test-util",
    "cortex-cubecl-fusion?/test-util",
]

# CubeCL backends
cube = [
    "cubek",
    "autotune",
    "cortex-tensor/ndarray",
    "cortex-ndarray",
    # Not used directly, but included to avoid recompiling with and without fusion
    "cortex-cubecl",
    # Direct dependency so fusion tests can assert launch-level decisions (in-place aliasing).
    "cortex-cubecl-fusion",
]

# Test configs
quantization = []
# Enables the collective (all-reduce) tests, which require a CUDA backend built with NCCL.
# Kept separate from `cuda` so the rest of the suite can run on CUDA without NCCL.
distributed = ["cuda"]

[dependencies]
cortex-tensor = { workspace = true, features = ["autodiff"] }
cortex-backend = { workspace = true }

# For random tests
cubek = { workspace = true, features = ["random"], optional = true }

# Explicitly enable test-only checks
cortex-autodiff = { workspace = true, features = ["export_tests"] }
cortex-ndarray = { workspace = true, optional = true, features = [
    "export_tests",
] }

# Manually enable so running the tests again with fusion feature doesn't have to compile other crates
cortex-cubecl = { workspace = true, optional = true, features = [
    "default",
    "fusion",
] }
cortex-cubecl-fusion = { workspace = true, optional = true }

# Enabled alongside the `fusion` feature so spy-based tests can import the spy API.
cortex-fusion = { workspace = true, optional = true }

# allows us to explicitly enable simd without rayon
cortex-flex = { workspace = true, optional = true }

num-traits = { workspace = true }
serial_test = { workspace = true }
rand.workspace = true

# might-panic macro
proc-macro2 = { workspace = true }
quote = { workspace = true }
syn = { workspace = true }


[dev-dependencies]
# Used to initialize device settings (test dtypes)
ctor = "0.10.1"
divan = "0.1"

