[package]
authors = ["nathanielsimard <nathaniel.simard.42@gmail.com>"]
categories = ["science", "development-tools::profiling"]
description = "Measure where a Cortex model's device time goes, component by component"
documentation = "https://docs.rs/cortex-instrument"
edition.workspace = true
keywords = ["deep-learning", "machine-learning", "profiling"]
license.workspace = true
name = "cortex-instrument"
readme.workspace = true
repository = "https://github.com/tracel-ai/burn/tree/main/crates/burn-instrument"
version.workspace = true

[lints]
workspace = true

[features]
default = ["std", "instrument", "fusion", "cortex-tensor/default"]
doc = ["default", "cubecl", "instrument", "fusion"]
std = [
    "cortex-tensor/std",
    "dep:serde",
    "dep:serde_json",
    "dep:thiserror",
    "serde/std",
    "serde_json/std",
    "cortex-fusion?/std",
    "cortex-ir?/std",
]
# Installing an observer, which arms every annotated method: without it, `observing()` is always
# `None` and an annotation compiles to the method's body, so a library annotates its components
# without costing a build that never measures. Off in cortex unless its `instrument` feature asks.
instrument = ["std"]
# The device's peaks, and with `instrument` the collector, which reads a cubecl runtime's launches.
# A runtime enables it, so it must not arm the annotations on its own.
cubecl = ["std", "dep:cubecl", "dep:cubecl-common", "cortex-tensor/cubecl"]
# The collector also reads the fusion server's blocks, so it can collect a device that fuses.
# Enabled with `cortex-core/fusion`, so a build that cannot fuse does not compile the fusion server
# for it; a collector built without it refuses a device that fuses rather than place its kernels
# wrongly.
fusion = ["dep:cortex-fusion", "dep:cortex-ir", "cortex-tensor/fusion"]

# The collector's integration tests, which need kernels to place. Enable a cubecl runtime
# separately (e.g. `cortex-tensor/wgpu`) and select it with CORTEX_DEVICE; add `fusion` for the fused
# half.
collector-tests = ["cubecl", "instrument"]

[dependencies]
cortex-instrument-macros = { workspace = true }
cortex-tensor = { workspace = true }

serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }

cortex-fusion = { workspace = true, optional = true }
cortex-ir = { workspace = true, optional = true }
cubecl = { workspace = true, optional = true, features = ["std"] }
cubecl-common = { workspace = true, optional = true, features = ["std"] }

[dev-dependencies]
cortex-tensor = { workspace = true, features = ["flex"] }

[package.metadata.docs.rs]
features = ["doc"]
rustdoc-args = ["--cfg", "docsrs"]
