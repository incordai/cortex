[package]
authors = ["nathanielsimard <nathaniel.simard.42@gmail.com>"]
categories = ["science", "no-std", "embedded", "wasm"]
description = "Flexible and Comprehensive Deep Learning Framework in Rust"
documentation = "https://docs.rs/burn"
edition.workspace = true
keywords = [
    "deep-learning",
    "machine-learning",
    "tensor",
    "pytorch",
    "autodiff",
]
license.workspace = true
name = "cortex"
readme.workspace = true
repository = "https://github.com/tracel-ai/burn"
rust-version = "1.95"
version.workspace = true

[package.metadata.docs.rs]
features = ["doc"]
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

[features]
default = [
    "std",
    "optim",
    "cortex-core/default",
    "cortex-train?/default",
    "cortex-nn/default",
    "cortex-linalg?/default",
    "cortex-optim?/default",
    "cortex-signal?/default",
    "cortex-vision?/default",
]
doc = [
    "default",
    "flex",
    "train",
    "cortex-core/doc",
    "cortex-train/doc",
    "cortex-store?/std",
    "cortex-nn/doc",
    "linalg",
    "cortex-optim?/doc",
    "rl",
    "signal",
    "vision",
]
std = [
    "cortex-core/std",
    "cortex-store?/std",
    "cortex-nn/std",
    "cortex-linalg?/std",
    "cortex-signal?/std",
    "cortex-optim?/std",
]
tracing = [
    "cubecl?/tracing",
    "cortex-core/tracing",
    "cortex-signal?/tracing",
    "cortex-vision?/tracing",
    "cortex-nn/tracing",
    "cortex-linalg?/tracing",
    "cortex-optim?/tracing",
]


network = ["cortex-core/network"]

# Training with full features
train = ["cortex-train", "optim", "dataset"]

## Includes the Text UI (progress bars, metric plots)
tui = ["cortex-train?/tui"]

##  Includes system info metrics (CPU/GPU usage, etc)
metrics = ["cortex-train?/sys-metrics"]

# Datasets
dataset = ["cortex-core/dataset"]

sqlite = ["cortex-core/sqlite"]
sqlite-bundled = ["cortex-core/sqlite-bundled"]

# Model storage and serialization (SafeTensors, PyTorch interop)
store = ["cortex-store"]

# Enable safetensors in cortex-store.
safetensors = ["store", "cortex-store?/safetensors"]
# Enable pytorch in cortex-store.
pytorch = ["store", "cortex-store?/pytorch"]

# CubeCL re-export
cubecl = ["dep:cubecl"]

audio = ["cortex-core/audio"]
vision = ["cortex-core/vision", "cortex-vision"]
linalg = ["dep:cortex-linalg"]
signal = ["dep:cortex-signal"]
rl = ["dep:cortex-rl", "cortex-train?/rl"]

# Optimizer
optim = ["cortex-optim", "autodiff"]

# Backend
ir = ["cortex-core/ir"]
autodiff = ["cortex-core/autodiff", "cortex-signal?/autodiff"]
fusion = ["ir", "cortex-core/fusion", "cortex-linalg?/fusion", "cortex-signal?/fusion", "cortex-vision?/fusion"]

## Backend features
accelerate = ["cortex-core/accelerate"]
autotune = ["cortex-core/autotune", "cortex-signal?/autotune"]
autotune-checks = ["cortex-core/autotune-checks"]
blas-netlib = ["cortex-core/blas-netlib"]
openblas = ["cortex-core/openblas"]
openblas-system = ["cortex-core/openblas-system"]
simd = ["cortex-core/simd"]
rayon = ["cortex-core/rayon"]

# Opt-in CPU codegen paths.
x86-v4 = ["cortex-core/x86-v4"]
apple-amx = ["cortex-core/apple-amx"]

template = ["cortex-core/template"]
remote = ["cortex-core/remote", "cortex-linalg?/remote", "cortex-signal?/remote"]
remote-server = ["remote", "cortex-core/remote-server", "cortex-signal?/router"]
remote-websocket = ["remote", "cortex-core/remote-websocket", "cortex-signal?/remote-websocket"]

cuda = ["cortex-core/cuda", "cortex-linalg?/cuda", "cortex-signal?/cuda", "cortex-vision?/cuda"]
rocm = ["cortex-core/rocm", "cortex-linalg?/rocm", "cortex-signal?/rocm", "cortex-vision?/rocm"]
flex = ["cortex-core/flex", "cortex-linalg?/flex", "cortex-signal?/flex", "cortex-vision?/flex"]
ndarray = ["cortex-core/ndarray", "cortex-linalg?/ndarray"]
tch = ["cortex-core/tch", "cortex-linalg?/tch", "cortex-signal?/tch", "cortex-vision?/tch"]
vulkan = ["wgpu", "cortex-core/vulkan", "cortex-linalg?/vulkan", "cortex-signal?/vulkan", "cortex-vision?/vulkan"]
webgpu = ["wgpu", "cortex-core/webgpu", "cortex-linalg?/webgpu", "cortex-signal?/webgpu", "cortex-vision?/webgpu"]
metal = ["wgpu", "cortex-core/metal", "cortex-linalg?/metal", "cortex-signal?/metal", "cortex-vision?/metal"]
wgpu = ["cortex-core/wgpu", "cortex-linalg?/wgpu", "cortex-signal?/wgpu", "cortex-vision?/wgpu"]
cpu = ["cortex-core/cpu", "cortex-linalg?/cpu", "cortex-signal?/cpu", "cortex-vision?/cpu"]

# Backend extensions
extension = ["cortex-core/extension"]
capture = ["cortex-core/capture", "cortex-linalg?/capture", "cortex-signal?/capture"]

[dependencies]

# ** Please make sure all dependencies support no_std when std is disabled **

cortex-core = { workspace = true }
cortex-linalg = { workspace = true, optional = true }
cortex-train = { workspace = true, optional = true }
cortex-store = { workspace = true, optional = true }
cortex-nn = { workspace = true }
cortex-optim = { workspace = true, optional = true }
cortex-rl = { workspace = true, optional = true }
cortex-signal = { workspace = true, optional = true }
cortex-vision = { workspace = true, optional = true }
cortex-std = { workspace = true }

# Backend implementations and their public facade re-exports are owned by cortex-core;
# dispatch itself continues through cortex-tensor -> cortex-dispatch.

cubecl = { workspace = true, optional = true }
