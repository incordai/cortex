[package]
authors = ["nathanielsimard <nathaniel.simard.42@gmail.com>"]
categories = ["science", "no-std", "embedded", "wasm"]
description = "Neural network building blocks for the Cortex deep learning framework"
documentation = "https://docs.rs/cortex-nn"
edition.workspace = true
keywords = ["deep-learning", "machine-learning", "tensor", "pytorch"]
license.workspace = true
name = "cortex-nn"
readme = "README.md"
repository = "https://github.com/tracel-ai/burn/tree/main/crates/burn-nn"
version.workspace = true

[lints]
workspace = true

[features]
default = ["std", "cortex-core/default"]
doc = [
    "std",
    # Doc features
    "cortex-core/doc",
    "linalg",
]
std = ["cortex-core/std", "cortex-linalg?/std", "num-traits/std"]

tracing = ["cortex-core/tracing", "cortex-linalg?/tracing"]

# Orthogonal initialization, cosine similarity and pairwise distance modules, and cosine embedding
# and triplet margin losses.
linalg = ["dep:cortex-linalg"]

[dependencies]

# ** Please make sure all dependencies support no_std when std is disabled **
cortex-core = { workspace = true }
cortex-linalg = { workspace = true, optional = true }

num-traits = { workspace = true }

[dev-dependencies]
# `instrument`, for the tests that read what a layer declares.
cortex-core = { workspace = true, features = ["autodiff", "instrument"] }
rstest = { workspace = true }

[package.metadata.docs.rs]
features = ["doc"]
rustdoc-args = ["--cfg", "docsrs"]
