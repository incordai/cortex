[package]
authors = [
    "laggui <lagrange.guillaume.1@gmail.com>",
    "nathanielsimard <nathaniel.simard.42@gmail.com>",
]
categories = ["science"]
description = "Backend dispatch for the Cortex framework"
edition.workspace = true
keywords = ["deep-learning", "machine-learning", "data"]
license.workspace = true
name = "cortex-dispatch"
readme.workspace = true
repository = "https://github.com/tracel-ai/burn/tree/main/crates/burn-dispatch"
documentation = "https://docs.rs/burn-dispatch"
version.workspace = true

[lints]
workspace = true

[features]
default = [
    "std",
    "cortex-autodiff?/default",
    "cortex-cpu?/default",
    "cortex-cuda?/default",
    "cortex-flex/default",
    "cortex-ndarray?/default",
    "cortex-rocm?/default",
    "cortex-tch?/default",
    "cortex-wgpu?/default",
]
doc = ["default"]
std = [
    "cortex-backend/std",
    "cortex-autodiff?/std",
    "cortex-cpu?/std",
    "cortex-cuda?/std",
    "cortex-flex/std",
    "cortex-ndarray?/std",
    "cortex-rocm?/std",
    "cortex-tch?/std",
    "cortex-wgpu?/std",
]
tracing = [
    "cortex-autodiff?/tracing",
    "cortex-cpu?/tracing",
    "cortex-cuda?/tracing",
    "cortex-flex/tracing",
    "cortex-ndarray?/tracing",
    "cortex-rocm?/tracing",
    "cortex-tch?/tracing",
    "cortex-wgpu?/tracing",
]

# Enables cubecl-facing APIs (e.g. throughput measurement) on cubecl-backed devices.
cubecl = ["cortex-backend/cubecl"]

# Backends
cuda = ["cortex-cuda", "cubecl"]
flex = [] # default
rocm = ["cortex-rocm", "cubecl"]
ndarray = ["cortex-ndarray"]
tch = ["cortex-tch"]
vulkan = ["wgpu", "cortex-wgpu/vulkan"]
webgpu = ["wgpu", "cortex-wgpu/webgpu"]
metal = ["wgpu", "cortex-wgpu/metal"]
wgpu = ["cortex-wgpu", "cubecl"]
cpu = ["cortex-cpu", "cubecl"]
autodiff = ["cortex-autodiff"]
# Remote compute client over Iroh.
remote = ["std", "cortex-remote", "cortex-remote/iroh"]
# Host a remote compute server over Iroh.
remote-server = ["remote", "cortex-remote/server"]
# Add the legacy WebSocket transport.
remote-websocket = ["remote", "cortex-remote/websocket"]

# Backend features
autotune = [
    "cortex-wgpu?/autotune",
    "cortex-cuda?/autotune",
    "cortex-rocm?/autotune",
    "cortex-cpu?/autotune",
]
autotune-checks = [
    "cortex-wgpu?/autotune-checks",
    "cortex-cuda?/autotune-checks",
    "cortex-rocm?/autotune-checks",
    "cortex-cpu?/autotune-checks",
]
fusion = [
    "cortex-wgpu?/fusion",
    "cortex-cuda?/fusion",
    "cortex-rocm?/fusion",
    "cortex-cpu?/fusion",
    "cortex-remote?/fusion",
]

[dependencies]
cortex-backend = { workspace = true }

# Backends
cortex-autodiff = { workspace = true, optional = true }
cortex-cpu = { workspace = true, optional = true }
cortex-cuda = { workspace = true, optional = true }
cortex-flex = { workspace = true }
cortex-ndarray = { workspace = true, optional = true }
cortex-tch = { workspace = true, optional = true }
cortex-rocm = { workspace = true, optional = true }
cortex-wgpu = { workspace = true, optional = true }

cortex-remote = { workspace = true, optional = true, features = ["client"] }

# Op macros with `.as_$inner_kind()`
paste = { workspace = true }

[target.'cfg(not(target_has_atomic = "ptr"))'.dependencies]
cortex-flex = { workspace = true, features = ["critical-section"]}

[package.metadata.docs.rs]
features = ["doc"]
rustdoc-args = ["--cfg", "docsrs"]
