[package]
authors = [
    "laggui <lagrange.guillaume.1@gmail.com>",
    "nathanielsimard <nathaniel.simard.42@gmail.com>",
]
categories = ["science"]
description = "Backend dispatch for the Cortex framework"
edition.workspace = true
keywords = ["deep-learning", "machine-learning", "data"]
license.workspace = true
name = "cortex-dispatch"
readme = "README.md"
repository = "https://github.com/tracel-ai/burn/tree/main/crates/burn-dispatch"
documentation = "https://docs.rs/burn-dispatch"
version.workspace = true

[lints]
workspace = true

[features]
default = [
    "std",
    "cortex-autodiff?/default",
    "cortex-cubecl?/default",
    "cortex-flex?/default",
    "cortex-ndarray?/default",
    "cortex-tch?/default",
]
doc = ["default", "flex"]
std = [
    "cortex-backend/std",
    "cortex-autodiff?/std",
    "cortex-cubecl?/std",
    "cortex-flex?/std",
    "cortex-ndarray?/std",
    "cortex-tch?/std",
]
tracing = [
    "cortex-autodiff?/tracing",
    "cortex-cubecl?/tracing",
    "cortex-flex?/tracing",
    "cortex-ndarray?/tracing",
    "cortex-tch?/tracing",
]

# Enables cubecl-facing APIs (e.g. throughput measurement) on cubecl-backed devices.
cubecl = ["dep:cortex-cubecl", "cortex-backend/cubecl"]

# Backends
cuda = ["cubecl", "cortex-cubecl/cuda"]
flex = ["dep:cortex-flex"]
rocm = ["cubecl", "cortex-cubecl/hip"]
ndarray = ["cortex-ndarray"]
tch = ["cortex-tch"]
vulkan = ["wgpu", "cortex-cubecl/vulkan"]
webgpu = ["wgpu", "cortex-cubecl/webgpu"]
metal = ["wgpu", "cortex-cubecl/metal"]
wgpu = ["cubecl", "cortex-cubecl/wgpu"]
cpu = ["cubecl", "cortex-cubecl/cpu"]
autodiff = ["cortex-autodiff"]
# Remote compute client over Iroh.
remote = ["std", "cortex-remote", "cortex-remote/iroh"]
# Host a remote compute server over Iroh.
remote-server = ["remote", "cortex-remote/server"]
# Add the legacy WebSocket transport.
remote-websocket = ["remote", "cortex-remote/websocket"]
capture = ["cortex-capture"]

# Backend features
autotune = ["cortex-cubecl?/autotune"]
autotune-checks = ["cortex-cubecl?/autotune-checks"]
fusion = [
    "cortex-cubecl?/fusion",
    "cortex-remote?/fusion",
]

# CPU backend codegen and threading; these do not select a backend.
simd = ["cortex-flex?/simd", "cortex-ndarray?/simd"]
rayon = ["cortex-flex?/rayon", "cortex-ndarray?/multi-threads"]

# Opt-in gemm codegen paths (cortex-flex).
x86-v4 = ["cortex-flex?/x86-v4"]
apple-amx = ["cortex-flex?/apple-amx"]

# BLAS providers (cortex-ndarray).
accelerate = ["cortex-ndarray?/blas-accelerate"]
blas-netlib = ["cortex-ndarray?/blas-netlib"]
openblas = ["cortex-ndarray?/blas-openblas"]
openblas-system = ["cortex-ndarray?/blas-openblas-system"]

template = ["cortex-cubecl?/template"]

[dependencies]
cortex-backend = { workspace = true }
cortex-backend-extension = { workspace = true }

# Backends
cortex-autodiff = { workspace = true, optional = true }
# The one backend shared by every CubeCL runtime.
cortex-cubecl = { workspace = true, optional = true }
cortex-flex = { workspace = true, optional = true }
cortex-ndarray = { workspace = true, optional = true }
cortex-tch = { workspace = true, optional = true }

cortex-remote = { workspace = true, optional = true, features = ["client"] }
cortex-capture = { workspace = true, optional = true }

# Op macros with `.as_$inner_kind()`
paste = { workspace = true }

[target.'cfg(not(target_has_atomic = "ptr"))'.dependencies]
# Shared tensor infrastructure needs CAS even when no execution backend is selected.
portable-atomic = { workspace = true, features = ["critical-section"] }
cortex-flex = { workspace = true, optional = true, features = ["critical-section"] }

[package.metadata.docs.rs]
features = ["doc"]
rustdoc-args = ["--cfg", "docsrs"]
