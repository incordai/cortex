[package]
authors = ["nathanielsimard <nathaniel.simard.42@gmail.com>"]
categories = ["science", "no-std", "embedded", "wasm"]
description = "Tensor library with user-friendly APIs and automatic differentiation support"
documentation = "https://docs.rs/burn-tensor"
edition.workspace = true
keywords = ["deep-learning", "machine-learning", "tensor", "pytorch"]
license.workspace = true
name = "cortex-tensor"
readme = "README.md"
repository = "https://github.com/tracel-ai/burn/tree/main/crates/burn-tensor"
version.workspace = true

[lints]
workspace = true

[features]
default = ["std", "cortex-dispatch/default"]
doc = [
    "default",
    "flex",
    "wgpu",
    "wgpu-msl",
    "vulkan",
    "webgpu",
    "cuda",
    "rocm",
    "cpu",
    "dep:branches",
]
std = [
    "num-traits/std",
    "cortex-std/std",
    "cortex-backend/std",
    "cortex-dispatch/std",
    "colored",
]
tracing = ["cortex-std/tracing", "cortex-backend/tracing", "cortex-dispatch/tracing"]

cubecl = ["cortex-backend/cubecl", "cortex-dispatch/cubecl"]
cubecl-cuda = ["cortex-backend/cubecl-cuda"]
cubecl-hip = ["cortex-backend/cubecl-hip"]
cubecl-wgpu = ["cortex-backend/cubecl-wgpu"]
cubecl-wgpu-msl = ["cortex-backend/cubecl-wgpu-msl"]
cubecl-metal = ["cortex-backend/cubecl-metal"]
cubecl-vulkan = ["cortex-backend/cubecl-vulkan"]
cubecl-webgpu = ["cortex-backend/cubecl-webgpu"]
cubecl-cpu = ["cortex-backend/cubecl-cpu"]

# Backends
cuda = ["cortex-dispatch/cuda", "cubecl-cuda", "cubecl"]
rocm = ["cortex-dispatch/rocm", "cubecl-hip", "cubecl"]
flex = ["cortex-dispatch/flex"]
wgpu = ["cortex-dispatch/wgpu", "cubecl-wgpu", "cubecl"]
vulkan = ["wgpu", "cortex-dispatch/vulkan", "cubecl-vulkan"]
webgpu = ["wgpu", "cortex-dispatch/webgpu", "cubecl-webgpu"]
wgpu-msl = ["wgpu", "cortex-dispatch/wgpu-msl", "cubecl-wgpu-msl"]
metal = ["cortex-dispatch/metal", "cubecl-metal", "cubecl"]
cpu = ["cortex-dispatch/cpu", "cubecl-cpu", "cubecl"]
autodiff = ["cortex-dispatch/autodiff"]
# Remote compute client over Iroh.
remote = ["std", "cortex-dispatch/remote"]
# Host a remote compute server over Iroh. On wasm, it serves only on an application's endpoint.
remote-server = ["remote", "cortex-dispatch/remote-server"]
# Add the WebSocket transport, for clients and servers.
remote-websocket = ["remote", "cortex-dispatch/remote-websocket"]
capture = ["cortex-dispatch/capture", "dep:cortex-capture"]
# Experimental: tensors split over a group of devices.
shard = ["cortex-dispatch/shard"]

# For backend extensions
extension = []

# Backend features
persistence = ["cortex-dispatch/persistence"]
autotune = ["cortex-dispatch/autotune"]
autotune-checks = ["cortex-dispatch/autotune-checks"]
fusion = ["cortex-dispatch/fusion"]
simd = ["cortex-dispatch/simd"]
rayon = ["cortex-dispatch/rayon"]
x86-v4 = ["cortex-dispatch/x86-v4"]
apple-amx = ["cortex-dispatch/apple-amx"]
template = ["cortex-dispatch/template"]

[dependencies]
branches = { workspace = true, optional = true }
cortex-std = { workspace = true }
cortex-backend = { workspace = true }
cortex-dispatch = { workspace = true }
cortex-derive = { workspace = true }
cortex-einsum = { workspace = true }
cortex-capture = { workspace = true, optional = true }

colored = { workspace = true, optional = true }
derive-new = { workspace = true }
num-traits = { workspace = true }

# Serialization
serde = { workspace = true }

[dev-dependencies]
# Execution backend for tensor integration tests; ordinary builds remain backend-free.
cortex-dispatch = { workspace = true, features = ["flex"] }

[package.metadata.docs.rs]
features = ["doc"]
rustdoc-args = ["--cfg", "docsrs", "--html-in-header", "katex-header.html"]
