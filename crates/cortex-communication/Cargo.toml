[package]
authors = ["Guilhem Ané (@Cielbird)", "Nathaniel Simard (@nathanielsimard)"]
description = "Abstractions for network communication for Cortex"
edition.workspace = true
license.workspace = true
name = "cortex-communication"
readme = "README.md"
repository = "https://github.com/tracel-ai/burn/tree/main/crates/burn-communication"
version.workspace = true

[lints]
workspace = true

[features]
tracing = [
    "cortex-std/tracing",
    "cortex-backend?/tracing",
]

data-service = ["cortex-backend"]
websocket = ["axum", "tokio-tungstenite", "futures", "socket2"]

[dependencies]
cortex-std = { workspace = true, features = ["default"] }
bytes = { workspace = true }
derive-new = { workspace = true }
futures-util = { workspace = true }
log = { workspace = true }
rmp-serde = { workspace = true }
serde = { workspace = true, features = ["derive"] }
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "signal", "tracing"] }
tokio-util = { workspace = true }
tracing = { workspace = true, features = ["default"] }

# Tensor Data Service
cortex-backend = { workspace = true, optional = true, features = ["default"] }

# Websocket
axum = { workspace = true, features = ["ws"], optional = true }
tokio-tungstenite = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
socket2 = { workspace = true, optional = true }

[dev-dependencies]
# Integration tests for the websocket server (run with `--features websocket`).
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time", "net"] }
tokio-tungstenite = { workspace = true }
