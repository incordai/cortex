# cubecl at cubecl dev (the flip pin plus cubecl#2025's tiled metadata), until cubek pins a
# cubecl holding #2025. The host differs from the pin's so cargo takes it as a patch.

[profile.dev]
debug = 1 # Speed up compilation time and not necessary.
