[package]
authors = ["nathanielsimard <nathaniel.simard.42@gmail.com>"]
edition.workspace = true
license.workspace = true
name = "text-classification"
publish = false
version.workspace = true

[lints]
workspace = true

[features]
default = []
f16 = []
flex32 = []
tch-cpu = ["cortex/tch"]
tch-gpu = ["cortex/tch"]
wgpu = ["cortex/wgpu"]
vulkan = ["cortex/vulkan"]
flex = ["cortex/flex"]
remote = ["cortex/remote-websocket"]
cuda = ["cortex/cuda"]
rocm = ["cortex/rocm"]
metal = ["cortex/metal"]
# DDP (distributed data-parallel) training. The distributed runtime is always available with
# `std`, so this feature is just a marker that selects the DDP code paths in the example.
ddp = []

[dependencies]
# Cortex
cortex = { workspace = true, features = [
    "train",
    "optim",
    "tui",
    "sqlite-bundled",
    "metrics",
    "flex",
    "autotune",
    "fusion",
    "std",
] }
log = { workspace = true }

# Tokenizer
tokenizers = { version = "0.22.2", default-features = false, features = [
    "onig",
    "http",
] }

# Utils
derive-new = { workspace = true }
serde = { workspace = true, features = ["std", "derive"] }
