[package]
authors = ["nathanielsimard <nathaniel.simard.42@gmail.com>"]
edition.workspace = true
license.workspace = true
name = "text-classification"
publish = false
version.workspace = true

[lints]
workspace = true

[features]
default = []
f16 = []
bf16 = []
flex32 = []
wgpu = ["cortex/wgpu"]
vulkan = ["cortex/vulkan"]
flex = ["cortex/flex"]
remote = ["cortex/remote-websocket"]
cuda = ["cortex/cuda"]
rocm = ["cortex/rocm"]
metal = ["cortex/metal"]
# DDP (distributed data-parallel) training. The distributed runtime is always available with
# `std`, so this feature is just a marker that selects the DDP code paths in the example.
ddp = []
# Arms the model's `#[compute]` annotations for the `profile` example; the other examples leave
# them compiled away.
profile = ["cortex/instrument"]

[dependencies]
# Cortex
cortex = { workspace = true, features = [
    "train",
    "optim",
    "tui",
    "sqlite",
    "metrics",
    "flex",
    "autotune",
    "fusion",
    "std",
] }
log = { workspace = true }

# Tokenizer
tokenizers = { version = "0.23.2", default-features = false, features = [
    "onig",
    "http",
] }

# Utils
derive-new = { workspace = true }
serde = { workspace = true, features = ["std", "derive"] }

[dev-dependencies]
# The report the `profile` example prints.
cortex-instrument-report = { workspace = true }

[[example]]
name = "profile"
required-features = ["profile"]
