[package]
authors = ["nathanielsimard <nathaniel.simard.42@gmail.com>"]
edition.workspace = true
license.workspace = true
name = "server"
publish = false
version.workspace = true

[lints]
workspace = true

[features]
default = ["webgpu"]
cuda = ["cortex/cuda"]
webgpu = ["cortex/webgpu"]
vulkan = ["cortex/vulkan"]
rocm = ["cortex/rocm"]
flex = ["cortex/flex"]

[dependencies]
cortex = { workspace = true, features = ["default", "remote-server", "remote-websocket"] }
