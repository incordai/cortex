[package]
authors = ["nathanielsimard <nathaniel.simard.42@gmail.com>"]
edition.workspace = true
license.workspace = true
name = "guide"
publish = false
version.workspace = true

[lints]
workspace = true

[features]
default = ["cortex/default", "cortex/tui"]
# Opt-in for macOS users with the Vulkan SDK installed (enabled by default on other platforms)
vulkan = ["cortex/vulkan"]

[dependencies]
cortex = { workspace = true, features = [
    "wgpu",
    "train",
    "vision",
] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
cortex = { workspace = true, features = ["default", "vulkan"] }

log = { workspace = true }
