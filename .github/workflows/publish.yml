name: publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry-run-only:
        description: "Run xtask publish in dry-run mode (no publish)"
        type: boolean
        required: false
        default: false

jobs:
  publish-cortex-rl:
    needs:
      - publish-cortex-core
    uses: tracel-ai/github-actions/.github/workflows/publish-crate.yml@v11
    with:
      crate: cortex-rl
      dry-run-only: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run-only || false }}
    secrets:
      CRATES_IO_API_TOKEN: ${{ secrets.CRATES_IO_API_TOKEN }}

  publish-cortex-vision:
    needs:
      - publish-cortex-fusion
      - publish-cortex-cubecl
      - publish-cortex-core
      - publish-cortex-store
    uses: tracel-ai/github-actions/.github/workflows/publish-crate.yml@v11
    with:
      crate: cortex-vision
      dry-run-only: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run-only || false }}
    secrets:
      CRATES_IO_API_TOKEN: ${{ secrets.CRATES_IO_API_TOKEN }}

  publish-cortex-linalg:
    needs:
      - publish-cortex-core
      - publish-cortex-cubecl
      - publish-cortex-fusion
      - publish-cortex-router
    uses: tracel-ai/github-actions/.github/workflows/publish-crate.yml@v11
    with:
      crate: cortex-linalg
      dry-run-only: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run-only || false }}
    secrets:
      CRATES_IO_API_TOKEN: ${{ secrets.CRATES_IO_API_TOKEN }}

  publish-cortex-signal:
    needs:
      - publish-cortex-core
      - publish-cortex-cubecl
      - publish-cortex-fusion
      - publish-cortex-router
      - publish-cortex-autodiff
      - publish-cortex-flex
      - publish-cortex-tch
      - publish-cortex-remote
    uses: tracel-ai/github-actions/.github/workflows/publish-crate.yml@v11
    with:
      crate: cortex-signal
      dry-run-only: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run-only || false }}
    secrets:
      CRATES_IO_API_TOKEN: ${{ secrets.CRATES_IO_API_TOKEN }}

  publish-cortex-router:
    needs:
      - publish-cortex-ir
      - publish-cortex-std
      - publish-cortex-backend
      - publish-cortex-fusion
    uses: tracel-ai/github-actions/.github/workflows/publish-crate.yml@v11
    with:
      crate: cortex-router
      dry-run-only: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run-only || false }}
    secrets:
      CRATES_IO_API_TOKEN: ${{ secrets.CRATES_IO_API_TOKEN }}

  publish-cortex-capture:
    needs:
      - publish-cortex-backend
      - publish-cortex-ir
      - publish-cortex-router
      - publish-cortex-std
    uses: tracel-ai/github-actions/.github/workflows/publish-crate.yml@v11
    with:
      crate: cortex-capture
      dry-run-only: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run-only || false }}
    secrets:
      CRATES_IO_API_TOKEN: ${{ secrets.CRATES_IO_API_TOKEN }}

  publish-cortex-remote:
    needs:
      - publish-cortex-ir
      - publish-cortex-std
      - publish-cortex-backend
      - publish-cortex-fusion
      - publish-cortex-router
      - publish-cortex-communication
    uses: tracel-ai/github-actions/.github/workflows/publish-crate.yml@v11
    with:
      crate: cortex-remote
      dry-run-only: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run-only || false }}
    secrets:
      CRATES_IO_API_TOKEN: ${{ secrets.CRATES_IO_API_TOKEN }}

  publish-cortex-derive:
    needs:
      - publish-cortex-einsum
    uses: tracel-ai/github-actions/.github/workflows/publish-crate.yml@v11
    with:
      crate: cortex-derive
      dry-run-only: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run-only || false }}
    secrets:
      CRATES_IO_API_TOKEN: ${{ secrets.CRATES_IO_API_TOKEN }}

  publish-cortex-einsum:
    uses: tracel-ai/github-actions/.github/workflows/publish-crate.yml@v11
    with:
      crate: cortex-einsum
      dry-run-only: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run-only || false }}
    secrets:
      CRATES_IO_API_TOKEN: ${{ secrets.CRATES_IO_API_TOKEN }}

  publish-cortex-dataset:
    needs:
      - publish-cortex-std
    uses: tracel-ai/github-actions/.github/workflows/publish-crate.yml@v11
    with:
      crate: cortex-dataset
      dry-run-only: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run-only || false }}
    secrets:
      CRATES_IO_API_TOKEN: ${{ secrets.CRATES_IO_API_TOKEN }}

  publish-cortex-std:
    uses: tracel-ai/github-actions/.github/workflows/publish-crate.yml@v11
    with:
      crate: cortex-std
      dry-run-only: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run-only || false }}
    secrets:
      CRATES_IO_API_TOKEN: ${{ secrets.CRATES_IO_API_TOKEN }}

  publish-cortex-backend-extension:
    uses: tracel-ai/github-actions/.github/workflows/publish-crate.yml@v11
    with:
      crate: cortex-backend-extension
      dry-run-only: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run-only || false }}
    secrets:
      CRATES_IO_API_TOKEN: ${{ secrets.CRATES_IO_API_TOKEN }}

  publish-cortex-tensor:
    needs:
      - publish-cortex-std
      - publish-cortex-derive
      - publish-cortex-einsum
      - publish-cortex-backend
      - publish-cortex-dispatch
      - publish-cortex-backend-extension
    uses: tracel-ai/github-actions/.github/workflows/publish-crate.yml@v11
    with:
      crate: cortex-tensor
      dry-run-only: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run-only || false }}
    secrets:
      CRATES_IO_API_TOKEN: ${{ secrets.CRATES_IO_API_TOKEN }}

  publish-cortex-backend:
    needs:
      - publish-cortex-std
    uses: tracel-ai/github-actions/.github/workflows/publish-crate.yml@v11
    with:
      crate: cortex-backend
      dry-run-only: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run-only || false }}
    secrets:
      CRATES_IO_API_TOKEN: ${{ secrets.CRATES_IO_API_TOKEN }}

  publish-cortex-ir:
    needs:
      - publish-cortex-backend
    uses: tracel-ai/github-actions/.github/workflows/publish-crate.yml@v11
    with:
      crate: cortex-ir
      dry-run-only: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run-only || false }}
    secrets:
      CRATES_IO_API_TOKEN: ${{ secrets.CRATES_IO_API_TOKEN }}

  publish-cortex-fusion:
    needs:
      - publish-cortex-ir
      - publish-cortex-backend
      - publish-cortex-std
    uses: tracel-ai/github-actions/.github/workflows/publish-crate.yml@v11
    with:
      crate: cortex-fusion
      dry-run-only: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run-only || false }}
    secrets:
      CRATES_IO_API_TOKEN: ${{ secrets.CRATES_IO_API_TOKEN }}

  publish-cortex-cubecl-fusion:
    needs:
      - publish-cortex-ir
      - publish-cortex-std
      - publish-cortex-fusion
      - publish-cortex-backend
    runs-on: ubuntu-latest
    env:
      CRATE: cortex-cubecl-fusion
      PUBLISH_FEATURES: cubecl/wgpu
    # The shared publisher has no feature argument. Verify with a concrete
    # runtime here, without adding one to either crate's default features.
    steps: &publish-with-runtime
      - name: checkout
        uses: actions/checkout@v7
      - name: install rust
        uses: dtolnay/rust-toolchain@stable
      - name: validate version and check registry
        id: version
        shell: bash
        run: |
          package_id=$(cargo pkgid -p "$CRATE")
          version=${package_id##*#}
          version=${version##*@}
          tag_version=${GITHUB_REF_NAME#v}
          if [[ "$version" != "$tag_version" ]]; then
            echo "::error::Tag version ($tag_version) does not match $CRATE ($version)."
            exit 1
          fi

          # Explicitly query the registry, not the local workspace package.
          # If lookup fails, let cargo publish report any registry/network error.
          if cargo info --registry crates-io "$CRATE@$version" > /dev/null; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - name: verify package
        if: steps.version.outputs.published != 'true'
        run: cargo publish -p "$CRATE" --features "$PUBLISH_FEATURES" --dry-run
      - name: publish to crates.io
        if: steps.version.outputs.published != 'true' && (github.event_name != 'workflow_dispatch' || !inputs.dry-run-only)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_API_TOKEN }}
        run: cargo publish -p "$CRATE" --features "$PUBLISH_FEATURES"

  publish-cortex-cubecl:
    needs:
      - publish-cortex-ir
      - publish-cortex-std
      - publish-cortex-fusion
      - publish-cortex-cubecl-fusion
      - publish-cortex-backend
    runs-on: ubuntu-latest
    env:
      CRATE: cortex-cubecl
      PUBLISH_FEATURES: wgpu
    steps: *publish-with-runtime

  publish-cortex-autodiff:
    needs:
      - publish-cortex-backend
      - publish-cortex-std
    uses: tracel-ai/github-actions/.github/workflows/publish-crate.yml@v11
    with:
      crate: cortex-autodiff
      dry-run-only: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run-only || false }}
    secrets:
      CRATES_IO_API_TOKEN: ${{ secrets.CRATES_IO_API_TOKEN }}

  publish-cortex-tch:
    needs:
      - publish-cortex-backend
    uses: tracel-ai/github-actions/.github/workflows/publish-crate.yml@v11
    with:
      crate: cortex-tch
      dry-run-only: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run-only || false }}
    secrets:
      CRATES_IO_API_TOKEN: ${{ secrets.CRATES_IO_API_TOKEN }}

  publish-cortex-ndarray:
    needs:
      - publish-cortex-ir
      - publish-cortex-backend
      - publish-cortex-std
    uses: tracel-ai/github-actions/.github/workflows/publish-crate.yml@v11
    with:
      crate: cortex-ndarray
      dry-run-only: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run-only || false }}
    secrets:
      CRATES_IO_API_TOKEN: ${{ secrets.CRATES_IO_API_TOKEN }}

  publish-cortex-flex:
    needs:
      - publish-cortex-backend
      - publish-cortex-ir
      - publish-cortex-std
    uses: tracel-ai/github-actions/.github/workflows/publish-crate.yml@v11
    with:
      crate: cortex-flex
      dry-run-only: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run-only || false }}
    secrets:
      CRATES_IO_API_TOKEN: ${{ secrets.CRATES_IO_API_TOKEN }}

  publish-cortex-wgpu:
    needs:
      - publish-cortex-backend
      - publish-cortex-fusion
      - publish-cortex-cubecl
    uses: tracel-ai/github-actions/.github/workflows/publish-crate.yml@v11
    with:
      crate: cortex-wgpu
      dry-run-only: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run-only || false }}
    secrets:
      CRATES_IO_API_TOKEN: ${{ secrets.CRATES_IO_API_TOKEN }}

  publish-cortex-cpu:
    needs:
      - publish-cortex-backend
      - publish-cortex-fusion
      - publish-cortex-cubecl
    uses: tracel-ai/github-actions/.github/workflows/publish-crate.yml@v11
    with:
      crate: cortex-cpu
      dry-run-only: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run-only || false }}
    secrets:
      CRATES_IO_API_TOKEN: ${{ secrets.CRATES_IO_API_TOKEN }}

  publish-cortex-cuda:
    needs:
      - publish-cortex-backend
      - publish-cortex-fusion
      - publish-cortex-cubecl
    uses: tracel-ai/github-actions/.github/workflows/publish-crate.yml@v11
    with:
      crate: cortex-cuda
      dry-run-only: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run-only || false }}
    secrets:
      CRATES_IO_API_TOKEN: ${{ secrets.CRATES_IO_API_TOKEN }}

  publish-cortex-rocm:
    needs:
      - publish-cortex-backend
      - publish-cortex-fusion
      - publish-cortex-cubecl
    uses: tracel-ai/github-actions/.github/workflows/publish-crate.yml@v11
    with:
      crate: cortex-rocm
      dry-run-only: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run-only || false }}
    secrets:
      CRATES_IO_API_TOKEN: ${{ secrets.CRATES_IO_API_TOKEN }}

  publish-cortex-pack:
    needs:
      - publish-cortex-std
    uses: tracel-ai/github-actions/.github/workflows/publish-crate.yml@v11
    with:
      crate: cortex-pack
      dry-run-only: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run-only || false }}
    secrets:
      CRATES_IO_API_TOKEN: ${{ secrets.CRATES_IO_API_TOKEN }}

  publish-cortex-communication:
    needs:
      - publish-cortex-std
      - publish-cortex-backend
    uses: tracel-ai/github-actions/.github/workflows/publish-crate.yml@v11
    with:
      crate: cortex-communication
      dry-run-only: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run-only || false }}
    secrets:
      CRATES_IO_API_TOKEN: ${{ secrets.CRATES_IO_API_TOKEN }}

  publish-cortex-core:
    needs:
      - publish-cortex-dataset
      - publish-cortex-std
      - publish-cortex-derive
      - publish-cortex-tensor
      - publish-cortex-pack
      - publish-cortex-ir
      - publish-cortex-dispatch
      - publish-cortex-backend-extension
    uses: tracel-ai/github-actions/.github/workflows/publish-crate.yml@v11
    with:
      crate: cortex-core
      dry-run-only: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run-only || false }}
    secrets:
      CRATES_IO_API_TOKEN: ${{ secrets.CRATES_IO_API_TOKEN }}

  publish-cortex-nn:
    needs:
      - publish-cortex-core
      - publish-cortex-linalg
    uses: tracel-ai/github-actions/.github/workflows/publish-crate.yml@v11
    with:
      crate: cortex-nn
      dry-run-only: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run-only || false }}
    secrets:
      CRATES_IO_API_TOKEN: ${{ secrets.CRATES_IO_API_TOKEN }}

  publish-cortex-optim:
    needs:
      - publish-cortex-core
      - publish-cortex-derive
      - publish-cortex-pack
    uses: tracel-ai/github-actions/.github/workflows/publish-crate.yml@v11
    with:
      crate: cortex-optim
      dry-run-only: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run-only || false }}
    secrets:
      CRATES_IO_API_TOKEN: ${{ secrets.CRATES_IO_API_TOKEN }}

  publish-cortex-train:
    needs:
      - publish-cortex-core
      - publish-cortex-optim
      - publish-cortex-rl
      - publish-cortex-nn
      - publish-cortex-store
      - publish-cortex-std
    uses: tracel-ai/github-actions/.github/workflows/publish-crate.yml@v11
    with:
      crate: cortex-train
      dry-run-only: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run-only || false }}
    secrets:
      CRATES_IO_API_TOKEN: ${{ secrets.CRATES_IO_API_TOKEN }}

  publish-cortex-dispatch:
    needs:
      - publish-cortex-std
      - publish-cortex-backend
      - publish-cortex-backend-extension
      - publish-cortex-autodiff
      - publish-cortex-cpu
      - publish-cortex-cuda
      - publish-cortex-rocm
      - publish-cortex-wgpu
      - publish-cortex-flex
      - publish-cortex-ndarray
      - publish-cortex-tch
      - publish-cortex-remote
      - publish-cortex-capture
    uses: tracel-ai/github-actions/.github/workflows/publish-crate.yml@v11
    with:
